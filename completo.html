<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estudio Completo | Discipulado General RcD</title>
<style>
:root{--bg:#f7f5f0;--surface:#fff;--border:#e0dbd0;--border2:#c8c1b0;--text:#1a1814;--text2:#6b6457;--text3:#9b9289;--accent:#3b6b3e;--accent-bg:#eaf3eb;--accent-text:#2a4f2c;--gold:#8a6f2e;--gold-bg:#faf3e0;--gold-text:#6b5420;--danger:#8b2e2e;--danger-bg:#fdf0f0;--radius:12px;--radius-sm:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Georgia','Times New Roman',serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:3rem}
header{background:var(--accent);color:white;padding:1.5rem;text-align:center}
header .eyebrow{font-family:Arial,sans-serif;font-size:11px;letter-spacing:.15em;text-transform:uppercase;opacity:.7;margin-bottom:6px}
header h1{font-size:1.4rem;font-weight:normal;margin-bottom:4px}
header p{font-family:Arial,sans-serif;font-size:12px;opacity:.75;font-style:italic}
.back-link{display:block;text-align:center;padding:10px;font-family:Arial,sans-serif;font-size:13px;color:var(--accent);text-decoration:none;border-bottom:1px solid var(--border)}
.back-link:hover{background:#f0ede6}
.tabs-wrap{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1rem;display:flex;overflow-x:auto}
.tab-btn{padding:14px 16px;border:none;background:transparent;font-family:Arial,sans-serif;font-size:13px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:bold}
.tab-btn:hover:not(.active){color:var(--text)}
.screen{display:none;padding:1.25rem 1rem;max-width:680px;margin:0 auto}
.screen.active{display:block}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem}
.filter-btn{padding:6px 12px;border:1px solid var(--border2);border-radius:99px;font-family:Arial,sans-serif;font-size:12px;background:var(--surface);color:var(--text2);cursor:pointer;transition:all .15s}
.filter-btn.active{background:var(--accent);color:white;border-color:var(--accent)}
.prog-row{display:flex;justify-content:space-between;font-family:Arial,sans-serif;font-size:12px;color:var(--text3);margin-bottom:6px}
.prog-track{height:5px;background:#f0ede6;border-radius:99px;margin-bottom:1.25rem}
.prog-fill{height:5px;background:var(--accent);border-radius:99px;transition:width .35s}
.flashcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);min-height:260px;padding:1.75rem 1.5rem;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;cursor:pointer;transition:border-color .2s}
.flashcard:hover{border-color:var(--border2)}
.fc-chap{font-family:Arial,sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);background:var(--bg);padding:3px 8px;border-radius:99px}
.fc-ref{font-family:Arial,sans-serif;font-size:11px;font-weight:bold;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-text);background:var(--accent-bg);padding:4px 12px;border-radius:99px}
.fc-theme{font-family:Arial,sans-serif;font-size:11px;color:var(--text3);letter-spacing:.06em;text-transform:uppercase}
.fc-question{font-size:1rem;line-height:1.65;color:var(--text);font-style:italic}
.fc-verse{font-size:.93rem;line-height:1.8;color:var(--text)}
.fc-keyword{font-family:Arial,sans-serif;font-size:12px;color:var(--gold-text);background:var(--gold-bg);border:1px solid #e0d08a;border-radius:var(--radius-sm);padding:6px 12px;margin-top:4px}
.fc-hint{font-family:Arial,sans-serif;font-size:11px;color:var(--text3)}
.fc-front{display:flex;flex-direction:column;align-items:center;gap:10px}
.fc-back{display:none;flex-direction:column;align-items:center;gap:10px}
.flashcard.flipped .fc-front{display:none}
.flashcard.flipped .fc-back{display:flex}
.card-btns{display:flex;gap:10px;margin-top:1rem}
.btn{flex:1;padding:11px;border-radius:var(--radius-sm);font-family:Arial,sans-serif;font-size:14px;cursor:pointer;border:1px solid var(--border2);background:var(--surface);color:var(--text);transition:all .15s}
.btn:hover{background:#f0ede6}
.btn.green{border-color:#7ab87d;color:#2a4f2c;background:#eaf3eb}
.btn.red{border-color:#e0a0a0;color:var(--danger);background:var(--danger-bg)}
.btn.primary{border-color:var(--accent);color:var(--accent-text);background:var(--accent-bg)}
.quiz-meta{font-family:Arial,sans-serif;font-size:12px;color:var(--text3);text-align:center;margin-bottom:1rem}
.quiz-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem 1.5rem;margin-bottom:1rem}
.quiz-chap{font-family:Arial,sans-serif;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.quiz-ref{font-family:Arial,sans-serif;font-size:11px;font-weight:bold;color:var(--accent-text);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
.quiz-q{font-size:.93rem;line-height:1.65;color:var(--text)}
.options{display:flex;flex-direction:column;gap:8px;margin-bottom:1rem}
.opt{padding:11px 14px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-family:Georgia,serif;font-size:.88rem;background:var(--surface);color:var(--text);text-align:left;cursor:pointer;line-height:1.5;transition:all .15s}
.opt:hover:not(:disabled){background:#f0ede6}
.opt.correct{background:#eaf3eb;border-color:#7ab87d;color:#2a4f2c}
.opt.wrong{background:var(--danger-bg);border-color:#e0a0a0;color:var(--danger)}
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:1.5rem}
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:1rem;text-align:center}
.stat-num{font-size:2rem;font-weight:normal;color:var(--text)}
.stat-lbl{font-family:Arial,sans-serif;font-size:10px;color:var(--text3);margin-top:4px;text-transform:uppercase;letter-spacing:.06em}
.vrow{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px}
.vdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.vdot.k{background:var(--accent)}
.vdot.l{background:var(--gold)}
.vdot.n{background:var(--border2)}
.vrow-ref{font-size:13px;font-weight:bold;color:var(--text)}
.vrow-detail{font-family:Arial,sans-serif;font-size:11px;color:var(--text3);margin-top:2px}
.vrow-status{font-family:Arial,sans-serif;font-size:11px;color:var(--text2);margin-left:auto;white-space:nowrap}
.section-title{font-family:Arial,sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:1rem;padding-bottom:8px;border-bottom:1px solid var(--border)}
footer{text-align:center;font-family:Arial,sans-serif;font-size:11px;color:var(--text3);margin-top:2rem}
</style>
</head>
<body>
<a class="back-link" href="index.html">← Volver al índice</a>
<header>
  <div class="eyebrow">RcD Salamanca · Discipulado General</div>
  <h1>Estudio Completo</h1>
  <p>Todos los versículos del discipulado general</p>
</header>
<div class="tabs-wrap">
  <button class="tab-btn active" onclick="switchTab('flashcards',this)">📖 Tarjetas</button>
  <button class="tab-btn" onclick="switchTab('quiz',this)">🧠 Quiz</button>
  <button class="tab-btn" onclick="switchTab('progreso',this)">📊 Progreso</button>
</div>

<!-- TARJETAS -->
<div id="screen-flashcards" class="screen active">
  <div class="filter-bar" id="filter-bar"></div>
  <div class="prog-row"><span id="fc-counter">1 / ?</span><span id="fc-chap-label"></span></div>
  <div class="prog-track"><div class="prog-fill" id="fc-bar" style="width:0%"></div></div>
  <div class="flashcard" id="flashcard" onclick="flipCard()">
    <div class="fc-front" id="fc-front"></div>
    <div class="fc-back" id="fc-back"></div>
  </div>
  <div class="card-btns" id="btns-flip">
    <button class="btn primary" onclick="flipCard();event.stopPropagation()">👁 Ver versículo completo</button>
  </div>
  <div class="card-btns" id="btns-eval" style="display:none">
    <button class="btn red" onclick="markCard(false)">✗ Necesito repasar</button>
    <button class="btn green" onclick="markCard(true)">✓ ¡Lo sé!</button>
  </div>
</div>

<!-- QUIZ -->
<div id="screen-quiz" class="screen">
  <div class="filter-bar" id="filter-bar-quiz"></div>
  <div class="quiz-meta" id="quiz-meta">Puntuación: 0 / 0</div>
  <div class="quiz-card">
    <div class="quiz-chap" id="quiz-chap"></div>
    <div class="quiz-ref" id="quiz-ref"></div>
    <div class="quiz-q" id="quiz-q"></div>
  </div>
  <div class="options" id="quiz-opts"></div>
  <button class="btn primary" id="quiz-next" style="display:none;width:100%" onclick="nextQuiz()">Siguiente →</button>
</div>

<!-- PROGRESO -->
<div id="screen-progreso" class="screen">
  <div class="section-title">Progreso global</div>
  <div class="stats-row">
    <div class="stat-box"><div class="stat-num" id="s-k">0</div><div class="stat-lbl">Dominados</div></div>
    <div class="stat-box"><div class="stat-num" id="s-l">0</div><div class="stat-lbl">Aprendiendo</div></div>
    <div class="stat-box"><div class="stat-num" id="s-n">0</div><div class="stat-lbl">Sin repasar</div></div>
  </div>
  <div id="verse-list"></div>
  <button class="btn red" style="width:100%;margin-top:1rem" onclick="resetAll()">↺ Reiniciar todo el progreso</button>
</div>

<footer><p>Reconcíliate con Dios · Salamanca · Reina Valera 1960</p></footer>

<script src="data.js"></script>
<script>
let activeFilter='all';
let filteredVerses=[];
let filteredQuiz=[];
let fcIdx=0,fcFlipped=false;
let qIdx=0,qScore=0,qTotal=0,qAnswered=false,qOrder=[];

function getStorageKey(capId){return 'rcd_'+capId;}
function getProgress(capId,ref){
  try{const p=JSON.parse(localStorage.getItem(getStorageKey(capId))||'{}');return p[ref]||{k:0,s:0};}
  catch(e){return {k:0,s:0};}
}
function saveProgress(capId,ref,knew){
  try{
    const key=getStorageKey(capId);
    const p=JSON.parse(localStorage.getItem(key)||'{}');
    if(!p[ref])p[ref]={k:0,s:0};
    p[ref].s++;
    if(knew)p[ref].k++;
    localStorage.setItem(key,JSON.stringify(p));
  }catch(e){}
}

function buildFilters(){
  ['filter-bar','filter-bar-quiz'].forEach(barId=>{
    const bar=document.getElementById(barId);
    const allBtn=document.createElement('button');
    allBtn.className='filter-btn active';
    allBtn.textContent='Todos';
    allBtn.dataset.filter='all';
    allBtn.onclick=()=>setFilter('all',barId);
    bar.appendChild(allBtn);
    CHAPTERS.forEach(ch=>{
      const btn=document.createElement('button');
      btn.className='filter-btn';
      btn.textContent='Cap.'+ch.num;
      btn.dataset.filter=ch.id;
      btn.onclick=()=>setFilter(ch.id,barId);
      bar.appendChild(btn);
    });
  });
}

function setFilter(filter,barId){
  activeFilter=filter;
  ['filter-bar','filter-bar-quiz'].forEach(bid=>{
    document.querySelectorAll('#'+bid+' .filter-btn').forEach(b=>{
      b.classList.toggle('active',b.dataset.filter===filter);
    });
  });
  applyFilter();
}

function applyFilter(){
  if(activeFilter==='all'){
    filteredVerses=CHAPTERS.flatMap(ch=>ch.verses.map(v=>({...v,capId:ch.id,capTitle:ch.title})));
    filteredQuiz=CHAPTERS.flatMap(ch=>ch.quiz.map(q=>({...q,capId:ch.id,capTitle:ch.title})));
  } else {
    const ch=CHAPTERS.find(c=>c.id===activeFilter);
    filteredVerses=ch?ch.verses.map(v=>({...v,capId:ch.id,capTitle:ch.title})):[];
    filteredQuiz=ch?ch.quiz.map(q=>({...q,capId:ch.id,capTitle:ch.title})):[];
  }
  fcIdx=0;renderCard();
  qOrder=[...Array(filteredQuiz.length).keys()].sort(()=>Math.random()-.5);
  qIdx=0;qScore=0;qTotal=0;showQuiz();
}

function renderCard(){
  if(!filteredVerses.length)return;
  const v=filteredVerses[fcIdx];
  const prog=getProgress(v.capId,v.ref);
  document.getElementById('flashcard').classList.remove('flipped');
  fcFlipped=false;
  document.getElementById('btns-flip').style.display='flex';
  document.getElementById('btns-eval').style.display='none';
  document.getElementById('fc-front').innerHTML=`
    <div class="fc-chap">${v.capTitle}</div>
    <div class="fc-ref">${v.ref}</div>
    <div class="fc-theme">${v.theme}</div>
    <div class="fc-question">"${v.question}"</div>
    <div class="fc-hint">— Toca para ver el versículo —</div>
  `;
  document.getElementById('fc-back').innerHTML=`
    <div class="fc-chap">${v.capTitle}</div>
    <div class="fc-ref">${v.ref}</div>
    <div class="fc-verse">${v.verse}</div>
    <div class="fc-keyword">📌 ${v.keyword}</div>
  `;
  document.getElementById('fc-chap-label').textContent=v.capTitle;
  const n=filteredVerses.length;
  document.getElementById('fc-counter').textContent=(fcIdx+1)+' / '+n;
  document.getElementById('fc-bar').style.width=((fcIdx+1)/n*100)+'%';
}

function flipCard(){
  if(fcFlipped)return;
  fcFlipped=true;
  document.getElementById('flashcard').classList.add('flipped');
  document.getElementById('btns-flip').style.display='none';
  document.getElementById('btns-eval').style.display='flex';
}

function markCard(knew){
  const v=filteredVerses[fcIdx];
  saveProgress(v.capId,v.ref,knew);
  fcIdx=(fcIdx+1)%filteredVerses.length;
  renderCard();
}

function showQuiz(){
  if(!filteredQuiz.length)return;
  if(qIdx>=filteredQuiz.length){
    document.getElementById('quiz-meta').textContent='¡Completado! Final: '+qScore+' / '+qTotal;
    document.getElementById('quiz-next').textContent='Repetir';
    document.getElementById('quiz-next').style.display='block';
    document.getElementById('quiz-opts').innerHTML='';
    return;
  }
  const q=filteredQuiz[qOrder[qIdx]];
  document.getElementById('quiz-chap').textContent=q.capTitle;
  document.getElementById('quiz-ref').textContent=q.ref;
  document.getElementById('quiz-q').textContent=q.q;
  document.getElementById('quiz-meta').textContent='Pregunta '+(qIdx+1)+' de '+filteredQuiz.length+' · '+qScore+'/'+qTotal;
  const opts=document.getElementById('quiz-opts');
  opts.innerHTML=q.opts.map((o,i)=>`<button class="opt" onclick="answerQ(${i})">${o}</button>`).join('');
  document.getElementById('quiz-next').style.display='none';
  qAnswered=false;
}

function answerQ(i){
  if(qAnswered)return;
  qAnswered=true;qTotal++;
  const q=filteredQuiz[qOrder[qIdx]];
  if(i===q.c)qScore++;
  document.getElementById('quiz-opts').querySelectorAll('.opt').forEach((o,idx)=>{
    o.disabled=true;
    if(idx===q.c)o.classList.add('correct');
    else if(idx===i)o.classList.add('wrong');
  });
  document.getElementById('quiz-meta').textContent='Pregunta '+(qIdx+1)+' de '+filteredQuiz.length+' · '+qScore+'/'+qTotal;
  document.getElementById('quiz-next').style.display='block';
}

function nextQuiz(){
  qIdx++;
  if(qIdx>=filteredQuiz.length){qOrder=[...Array(filteredQuiz.length).keys()].sort(()=>Math.random()-.5);qIdx=0;qScore=0;qTotal=0;}
  showQuiz();
}

function renderProgress(){
  let k=0,l=0,n=0,html='';
  CHAPTERS.forEach(ch=>{
    html+=`<div style="font-family:Arial,sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin:1rem 0 .5rem;padding-bottom:6px;border-bottom:1px solid var(--border)">${ch.title}</div>`;
    ch.verses.forEach(v=>{
      const p=getProgress(ch.id,v.ref);
      let dot='n',lbl='Sin repasar';
      if(p.s>0){if(p.k/p.s>=.8&&p.s>=3){dot='k';lbl='Dominado ✓';k++;}else{dot='l';lbl='Aprendiendo ('+p.k+'/'+p.s+')';l++;}}else n++;
      html+=`<div class="vrow"><div class="vdot ${dot}"></div><div><div class="vrow-ref">${v.ref}</div><div class="vrow-detail">${v.theme}</div></div><div class="vrow-status">${lbl}</div></div>`;
    });
  });
  document.getElementById('s-k').textContent=k;
  document.getElementById('s-l').textContent=l;
  document.getElementById('s-n').textContent=n;
  document.getElementById('verse-list').innerHTML=html;
}

function resetAll(){
  if(confirm('¿Reiniciar TODO el progreso del discipulado completo?')){
    CHAPTERS.forEach(ch=>localStorage.removeItem(getStorageKey(ch.id)));
    renderProgress();
  }
}

function switchTab(tab,el){
  document.querySelectorAll('.tab-btn').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('screen-'+tab).classList.add('active');
  if(tab==='progreso')renderProgress();
}

buildFilters();
applyFilter();
</script>
</body>
</html>
